name: Keep Render App Awake

on:
  schedule:
    - cron: '*/10 * * * *'  # every 10 minutes
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render dashboard
        run: |
          echo "Pinging Render app to keep it awake"
          curl -fsS https://model-portfolio-dashboard1.onrender.com/ || exit 1
